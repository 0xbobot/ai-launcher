name: Generate Debug Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -keypass android -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10950 -keyalg RSA -keysize 2048 \
            -storetype JKS
          keytool -list -keystore /tmp/debug.keystore -storepass android | head -5

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: /tmp/debug.keystore
