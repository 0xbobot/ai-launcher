name: Publish OTA

# 手动发布 OTA 更新：把最新一次构建成功的 APK 发到 GitHub Releases，
# update.json 推到 Bob 的 GitHub Pages 站（bobot.is-a.dev/ai-launcher/），
# App 端自动检查更新。
#
# 需要在仓库 Settings > Secrets 中配置：
#   PAGES_DEPLOY_TOKEN — 对 clawbobot/clawbobot.github.io 有 Contents 读写权限的
#   fine-grained PAT（只勾选该仓库，权限 Contents: Read and write）。
# GITHUB_TOKEN 需要 contents: write 权限（本 job 已声明）用于创建 Release。
#
# 兼容性：
# - update.json 的 schema 新增 prerelease 字段（v0.68.80），老版本 App 用
#   optBoolean 默认 false 解析，照常升级不受影响；
#   测试版 APK 照走 GitHub Releases 直链（OkHttp 默认跟随 releases/download 的 302）。
# - 正式版升级改走网站（2026-11-13，Bob：GitHub 有些运营商访问不了）：
#   prerelease=false 时 update.json 的 apkUrl 写
#   https://bobot.is-a.dev/ai-launcher/releases/ai-launcher-v<版本>.apk，
#   APK 同步推到 Pages 仓库 ai-launcher/releases/（版本文件 + 覆盖 latest.apk，
#   另写 latest.json：versionCode/versionName/apkUrl/sha256）；
#   测试版（prerelease=true）一切照旧，不往网站传 APK。
#   GitHub Release 仍照建（留作记录和备份），只改升级用的下载地址。
# - workflow_dispatch 接口不变（另一会话照常用），prerelease 输入同时控制
#   GitHub Release 的预发布标记和 update.json 里的 prerelease 字段。
# - update.json 新增 sha256 字段（v0.68.89）：对最终 APK 计算的 SHA-256；
#   新版 App 下载后校验，不符不安装；老版本 App 忽略未知字段不受影响。
# - 钉死取包（2026-11-11，494 教训）：dispatch_guard.py 在 dispatch 那一刻
#   锁定目标构建的 run id，随 build_run_id 输入传进来；工作流按这个 run id
#   精确下载那一次构建的产物，不再重新按"最新成功构建"挑——否则守卫检查
#   与工作流取包之间几十秒的窗口里，并行分支构建一旦变绿就会抢包
#   （494 的 publish-ota 就因此下了 smart-card-19 的 493 包、建 release
#   时报 v1.3.36 已存在而失败）。build_run_id 为空时（GitHub 界面手动
#   dispatch）仍走老路找最新成功构建，那条路仍有竞态，手动发版要自己
#   确认当时没有并行构建在跑。
# - changelog 输入应与仓库 CHANGELOG.md 顶部条目保持一致（约定见该文件头）。

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新日志（显示在 App 更新对话框里）"
        required: false
        default: "常规更新"
      prerelease:
        description: "是否作为预发布（测试包打预发布标记，不算正式版本）"
        required: false
        default: false
        type: boolean
      build_run_id:
        description: "钉死要用的 build-apk 构建 run id（dispatch_guard.py 在 dispatch 时锁定并传进来；为空则回退到找最新成功构建）"
        required: false
        default: ""
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ai-launcher
        uses: actions/checkout@v4

      - name: Resolve build run (pinned or latest)
        id: build_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          # 钉死优先：dispatch_guard 传了 build_run_id 时，只用那一次构建，
          # 不再重新挑"最新成功构建"。先核验：run 存在、结论 success、
          # 属于 Build Debug APK 工作流、build job 成功；任一不符都直接失败，
          # 不静默回退到最新构建（回退会重新打开竞态窗）。
          RUN_ID=""
          HEAD_SHA=""
          if [ -n "$PINNED_RUN_ID" ]; then
            echo "Pinned build run: $PINNED_RUN_ID (from dispatch guard, no re-selection)"
            CONC=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$PINNED_RUN_ID" --jq '.conclusion')
            WFNAME=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$PINNED_RUN_ID" --jq '.name')
            HEAD_SHA=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$PINNED_RUN_ID" --jq '.head_sha')
            if [ "$CONC" != "success" ]; then
              echo "Pinned run $PINNED_RUN_ID conclusion is '$CONC', not success" >&2
              exit 1
            fi
            if [ "$WFNAME" != "Build Debug APK" ]; then
              echo "Pinned run $PINNED_RUN_ID is from workflow '$WFNAME', not Build Debug APK" >&2
              exit 1
            fi
            JOBC=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$PINNED_RUN_ID/jobs" --jq '.jobs[] | select(.name=="build") | .conclusion')
            if [ "$JOBC" != "success" ]; then
              echo "Pinned run $PINNED_RUN_ID build job conclusion is '$JOBC', not success" >&2
              exit 1
            fi
            RUN_ID=$PINNED_RUN_ID
          else
            echo "No build_run_id pinned; falling back to latest successful build (manual dispatch path)"
            # 找最近一次 build job 成功的 run（smoke-test 可能因模拟器环境失败，不应阻塞发布）
            for RID in $(gh api "repos/0xbobot/ai-launcher/actions/workflows/build-apk.yml/runs?per_page=10" --jq '.workflow_runs[].id'); do
              CONC=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$RID/jobs" --jq '.jobs[] | select(.name=="build") | .conclusion')
              if [ "$CONC" = "success" ]; then
                RUN_ID=$RID
                HEAD_SHA=$(gh api "repos/0xbobot/ai-launcher/actions/runs/$RID" --jq '.head_sha')
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No run with successful build job found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Using build run: $RUN_ID ($HEAD_SHA)"

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ota
          gh run download "${{ steps.build_run.outputs.run_id }}" \
            -n ai-launcher-debug-apk -D ota/
          ls -la ota/

      - name: Generate update.json from APK metadata
        id: meta
        env:
          CHANGELOG: ${{ inputs.changelog }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # 版本号从 APK 本体解析（aapt），避免与 build.gradle.kts 不一致导致"假更新"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          BADGING=$("$ANDROID_HOME/build-tools/$BT/aapt" dump badging ota/app-debug.apk)
          CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+")
          NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          echo "APK versionCode=$CODE versionName=$NAME prerelease=$PRERELEASE"
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then echo "failed to parse APK version" >&2; exit 1; fi
          # 文件名带版本号：每个版本 URL 唯一，彻底避开各层缓存拿到旧包
          APK_FILE="ai-launcher-v${NAME}.apk"
          mv ota/app-debug.apk "ota/$APK_FILE"
          # v0.68.89：对改名后的最终 APK 算 SHA-256，写进 update.json 供 App 端校验
          SHA256=$(sha256sum "ota/$APK_FILE" | cut -d' ' -f1)
          echo "APK sha256=$SHA256"
          # 正式版升级改走网站（2026-11-13，Bob：GitHub 有些运营商访问不了）；
          # 测试版照走 GitHub Releases 直链。bash 算一次，python 直接用，
          # 不在两处各写一遍分流条件。
          if [ "$PRERELEASE" = "true" ]; then
            APK_URL="https://github.com/0xbobot/ai-launcher/releases/download/v${NAME}/ai-launcher-v${NAME}.apk"
          else
            APK_URL="https://bobot.is-a.dev/ai-launcher/releases/ai-launcher-v${NAME}.apk"
          fi
          echo "APK apkUrl=$APK_URL"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          ls -la ota/
          python3 - "$CODE" "$NAME" "$CHANGELOG" "$PRERELEASE" "$SHA256" "$APK_URL" <<'EOF'
          import json, sys
          code = int(sys.argv[1])
          name = sys.argv[2]
          changelog = sys.argv[3].strip() or "常规更新"
          prerelease = sys.argv[4] == "true"
          sha256 = sys.argv[5].strip().lower()
          apk_url = sys.argv[6]
          data = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": apk_url,
              "sha256": sha256,
              "changelog": changelog,
              "forceUpdate": False,
              "prerelease": prerelease,
          }
          with open("ota/update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(open("ota/update.json", encoding="utf-8").read())
          EOF

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ inputs.changelog }}
          PRERELEASE: ${{ inputs.prerelease }}
          HEAD_SHA: ${{ steps.build_run.outputs.head_sha }}
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          APK_FILE="${{ steps.meta.outputs.apk_file }}"
          TAG="v${NAME}"
          # tag 不存在时 gh 会自动建 tag（指向构建出该 APK 的 commit）；
          # release 已存在则直接报错退出，不静默吞掉（避免发错包）。
          PRE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRE_FLAG="--prerelease"; fi
          gh release create "$TAG" \
            --target "$HEAD_SHA" \
            --title "$TAG" \
            $PRE_FLAG \
            --notes "${CHANGELOG:-常规更新}" \
            "ota/$APK_FILE"
          echo "Release $TAG created: https://github.com/0xbobot/ai-launcher/releases/tag/$TAG"

      - name: Publish update.json to GitHub Pages repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
          APK_FILE: ${{ steps.meta.outputs.apk_file }}
          APK_URL: ${{ steps.meta.outputs.apk_url }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN secret is not set" >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/clawbobot/clawbobot.github.io.git" \
            pages
          mkdir -p pages/ai-launcher
          # 只动 ai-launcher/ 目录，不碰仓库里其他文件。
          # 测试版 APK 改走 GitHub Releases，不再进 Pages 仓库：一次性删掉历史旧包
          # （含 ai-launcher-latest.apk），以后只推 update.json。
          # 注意：这行只删 ai-launcher/ 根目录的 APK；正式版 APK 在
          # ai-launcher/releases/ 子目录，不受影响，不要删。
          rm -f pages/ai-launcher/*.apk
          cp ota/update.json pages/ai-launcher/
          # 正式版（prerelease 非 true）：APK 同步推到网站 ai-launcher/releases/
          # （版本文件 + 覆盖 latest.apk），另写 latest.json 供下载页/最新版链接用。
          # 测试版不往网站传 APK。判据与生成 update.json 那步一致（!= "true" 即正式版）。
          if [ "$PRERELEASE" != "true" ]; then
            mkdir -p pages/ai-launcher/releases
            cp "ota/$APK_FILE" "pages/ai-launcher/releases/$APK_FILE"
            cp "ota/$APK_FILE" pages/ai-launcher/releases/latest.apk
            # 注意：下面 heredoc 的正文与 EOF 必须顶到 10 格（与 run 块同级），
            # 不能跟着 if 再缩进——YAML 去掉 10 格后执行脚本里它们在第 0 列，
            # bash 才认得出 EOF；多缩 2 格正式版发版会在这步报 heredoc 未闭合。
            python3 - "${{ steps.meta.outputs.code }}" "${{ steps.meta.outputs.name }}" "$APK_URL" "$SHA256" <<'EOF'
          import json, sys
          data = {
              "versionCode": int(sys.argv[1]),
              "versionName": sys.argv[2],
              "apkUrl": sys.argv[3],
              "sha256": sys.argv[4].strip().lower(),
          }
          with open("pages/ai-launcher/releases/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(open("pages/ai-launcher/releases/latest.json", encoding="utf-8").read())
          EOF
            echo "Formal APK published to website: $APK_URL"
          fi
          cd pages
          git config user.name "Bobot"
          git config user.email "0xbobot@users.noreply.github.com"
          git add ai-launcher/
          MSG="ota: AI桌面 v${{ steps.meta.outputs.name }} (${{ steps.meta.outputs.code }})，APK 改走 GitHub Releases"
          if [ "$PRERELEASE" != "true" ]; then
            MSG="ota: AI桌面 v${{ steps.meta.outputs.name }} (${{ steps.meta.outputs.code }}) 正式版，APK 走网站 ai-launcher/releases/"
          fi
          git commit -m "$MSG" \
            || echo "nothing to commit"
          git push origin HEAD
