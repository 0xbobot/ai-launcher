name: Build Debug APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release APK (v0.52.0 瘦身：开混淆)
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature and manifest
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -8

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-launcher-release-apk
          path: app/build/outputs/apk/release/app-release.apk

