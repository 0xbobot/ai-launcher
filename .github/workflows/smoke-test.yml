name: Smoke Test (Emulator)

# 每版构建成功后自动冒烟：CI 模拟器装包 -> 手势脚本 -> 截图存档
# Bob 不再需要手动测每版；他只在里程碑版本做真机手感验收。
# publish-ota 只看 build-apk.yml 的 build job 结论，本 workflow 独立结论，失败不阻塞发布。

on:
  workflow_run:
    workflows: ["Build Debug APK"]
    types: [completed]
  # 分支验证用：workflow_run 不为非默认分支的构建触发，分支冒烟靠手动 dispatch
  # （R2 UI 分支 loop-r2-ui 首次发现，2026-10-20）。dispatch 时取该分支最近一次
  # 成功构建的 APK，checkout 用 dispatch 所在 ref 的代码（含 smoke.sh）。
  # PROBE-ONLY 修改（仅 probe-ci-gpu 分支，永不合入 main）：
  # 新 workflow 文件（如 probe-emu.yml）只在 probe 分支时按文件名 dispatch 会 404，
  # 故探针复用本文件：dispatch 时 inputs.gpu 选 GPU 模式，脚本换成探针。
  workflow_dispatch:
    inputs:
      gpu:
        description: "Probe GPU mode (probe-ci-gpu branch only)"
        type: choice
        default: swiftshader_indirect
        options:
          - swiftshader_indirect
          - angle_indirect
          - guest
          - swiftshader
      script:
        description: "Probe script (probe-ci-gpu branch only, round 2 bisect)"
        type: choice
        default: probe-emu.sh
        options:
          - probe-emu.sh
          - probe-app-idle.sh
          - probe-adb-load.sh
          - smoke-cut.sh
          - smoke-cut11.sh
          - smoke-nodate.sh
          - smoke-nodate-cut12.sh
          - smoke-nodate-cut19.sh
          - smoke-nodate-cut22.sh
          - smoke-nodate-cut30.sh
          - smoke-nodate-cut24.sh
          - smoke-nodate-cut28.sh

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # PROBE-ONLY: 45 分钟（原 30）。第六轮验证“全量去日期腿是否只是超时而非挂起”。
    timeout-minutes: 45
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download debug APK artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v27
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-apk.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: ai-launcher-debug-apk
          path: apk

      - name: Download debug APK artifact (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v27
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-apk.yml
          branch: ${{ github.ref_name }}
          workflow_conclusion: success
          name: ai-launcher-debug-apk
          path: apk

      - name: Install emulator system dependencies
        # ubuntu-24.04 runner 镜像缺 libpulse，qemu 启动直接报
        # "libpulse.so.0: cannot open shared object file"；先装上。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          # /dev/kvm 存在但 runner 用户不在 kvm 组 → 直接放开权限，启用硬件加速
          # （否则模拟器走 -accel off 软件模拟，启动慢到超时）
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # -no-window：CI 无显示器，headless 运行（否则 Qt 报
          # "no Qt platform plugin could be initialized" 直接崩溃）
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -camera-back none -gpu ${{ inputs.gpu || 'swiftshader_indirect' }}
          script: bash scripts/${{ inputs.script || 'probe-emu.sh' }}

      - name: Collect emulator crash evidence
        if: always()
        run: |
          mkdir -p probe-out
          find ~/.android -name "*crash*" -o -name "*.log" 2>/dev/null | head -50 > probe-out/crash-files.txt || true
          cat probe-out/crash-files.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cp "$f" probe-out/ 2>/dev/null || true
            ls -la "$f" 2>/dev/null || true
          done < probe-out/crash-files.txt
          ls -laR ~/.android/avd/ 2>/dev/null | head -100 || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-emu-${{ inputs.gpu || 'swiftshader_indirect' }}
          path: |
            probe-out/
            smoke-out/
          retention-days: 14
