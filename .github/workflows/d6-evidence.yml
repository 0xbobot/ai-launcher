name: D6 Evidence (Temporary)

# D-6 缺陷线临时取证 workflow（取证完成后随脚本一并删除，不进入待合状态）：
# 2026-10-23 hosted runner 模拟器 boot 后约 2.5 分钟 adb 掉线，全量 smoke
# 两轮未及第 28 段；本 workflow 只跑 scripts/d6_band_test.sh 最小对照。
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  d6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download debug APK artifact (dispatch)
        uses: dawidd6/action-download-artifact@v27
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-apk.yml
          branch: ${{ github.ref_name }}
          workflow_conclusion: success
          name: ai-launcher-debug-apk
          path: apk

      - name: Install emulator system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Run D6 band test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -camera-back none -gpu swiftshader_indirect
          script: bash scripts/d6_band_test.sh

      - name: Upload D6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-evidence
          path: d6-out/
          retention-days: 14
